name: Build Injector APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;25.2.9519653"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: true

      - name: Download libTool.so from Android-LibTool-New release
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/libTool.so "https://github.com/opanx/Android-LibTool-New/releases/download/v4.0/libTool.so" || echo "WARN: Could not download libTool.so"
          ls -la app/src/main/assets/ 2>/dev/null || true

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          keytool -genkey -v -keystore /tmp/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Panxcz,O=Freebuff,C=ID"
          $BUILD_TOOLS/zipalign -p 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          $BUILD_TOOLS/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out app/build/outputs/apk/release/panxcz-injector.apk /tmp/aligned.apk

      - name: Verify APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BUILD_TOOLS/apksigner verify --verbose app/build/outputs/apk/release/panxcz-injector.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Panxcz Injector v${{ steps.version.outputs.version }}"
          files: app/build/outputs/apk/release/panxcz-injector.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
