plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.panxcz.injector'
    compileSdk 34
    defaultConfig {
        applicationId "com.panxcz.injector"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cFlags '-O2'; arguments '-DANDROID_STL=c++_static' }
        }
    }
    buildTypes { release { minifyEnabled false } }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    applicationVariants.configureEach { variant ->
        variant.mergeAssetsProvider.configure {
            doLast {
                def injectorBin = file("${buildDir}/intermediates/cmake/${variant.name}/obj/arm64-v8a/injector")
                def assetsDir = file("${buildDir}/intermediates/assets/${variant.name}/out")
                if (injectorBin.exists()) {
                    copy { from injectorBin; into assetsDir; rename { 'injector' } }
                }
            }
        }
    }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
